# JVM settings for the Gradle daemon. file.encoding keeps javac happy with the
# Chinese / Japanese asset names used by the project.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Dependency versions are centrally managed here (project3 section 42): one
# place to bump the libGDX release for every module.
# If a build reports an unknown version, check the current release at
# https://libgdx.com/wiki/start/setup and update this value.
gdxVersion=1.13.5

# R13: the libGDX 1.13.5 android backend depends on androidx.core, so the
# Android Gradle Plugin requires the AndroidX flag.
android.useAndroidX=true